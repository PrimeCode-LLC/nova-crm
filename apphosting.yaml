# Firebase App Hosting: connect this repo in the Firebase Console (App Hosting) and point the root at `crm/`.
# Docs: https://firebase.google.com/docs/app-hosting
env:
  # Public site origin — required for OAuth redirects (App Hosting uses 0.0.0.0:8080 internally).
  - variable: SITE_URL
    value: https://nova.stellixsoft.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://nova.stellixsoft.com
    availability:
      - BUILD
      - RUNTIME
  # Fixed unpacked/store ID for Nova Intent Radar (team zip + future store builds).
  - variable: NOVA_EXTENSION_IDS
    value: kiggclhehjjlembdafbpkjeindbhbemk
    availability:
      - RUNTIME
  # P1.4 — manual scraper runs proxy to Cloud Functions (cron uses Functions param SCRAPERS_RUNTIME).
  - variable: SCRAPERS_RUNTIME
    value: functions
    availability:
      - RUNTIME
  - variable: SCRAPERS_WORKER_URL
    value: https://us-central1-novacrm-41ef8.cloudfunctions.net/runOrgScrapers
    availability:
      - RUNTIME
  # P1.5 — MillionVerifier bulk verify proxies to Cloud Functions.
  - variable: MILLIONVERIFIER_RUNTIME
    value: functions
    availability:
      - RUNTIME
  - variable: MILLIONVERIFIER_WORKER_URL
    value: https://us-central1-novacrm-41ef8.cloudfunctions.net/verifyMillionVerifierLeads
    availability:
      - RUNTIME
runConfig:
  # Keep one instance warm so the first requests after deploy (/, favicon, RSC) are not rejected with HTTP 429 while scaling from zero.
  minInstances: 1
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
