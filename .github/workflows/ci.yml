# CI — runs on every pull request (migration W0.5)
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_dev_password
          POSTGRES_DB: nova_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # App role — RLS enforced (FORCE). Never production (docs/ENVIRONMENTS.md).
      DATABASE_URL: postgres://nova_app:nova_dev_password@localhost:5432/nova_crm
      # DDL / migrate role (Compose superuser).
      MIGRATE_DATABASE_URL: postgres://nova:nova_dev_password@localhost:5432/nova_crm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Firebase removal gate (P7.9)
        run: node scripts/check-firebase-imports.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate Postgres (P2+)
        run: npm run db:migrate:deploy

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_AUTH_DISABLED: "true"
          DISABLE_AUTH: "true"
          AUTH_CLERK_V1: "true"
          NEXT_PUBLIC_AUTH_CLERK_V1: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci
          DATABASE_URL: postgres://nova_app:nova_dev_password@localhost:5432/nova_crm
          REDIS_URL: redis://localhost:6379

  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t nova-crm-web -f Dockerfile .
      - name: Build worker image
        run: docker build -t nova-crm-worker -f Dockerfile.worker .
      - name: Build migrate image
        run: docker build -t nova-crm-migrate -f Dockerfile.migrate .
