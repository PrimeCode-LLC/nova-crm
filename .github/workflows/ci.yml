# CI — production branch: feature/remove-firebase (PostgreSQL/VPS)
# main is Firebase reference only — no production CI/CD from main.
name: CI

on:
  pull_request:
    branches: [feature/remove-firebase]
  push:
    branches: [feature/remove-firebase]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_dev_password
          POSTGRES_DB: nova_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nova_app:nova_dev_password@localhost:5432/nova_crm
      MIGRATE_DATABASE_URL: postgres://nova:nova_dev_password@localhost:5432/nova_crm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Firebase removal gate (P7.9)
        run: node scripts/check-firebase-imports.mjs

      - name: Validate cron configuration
        run: node scripts/validate-cron-config.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate Postgres (P2+)
        run: npm run db:migrate:deploy

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_AUTH_DISABLED: "true"
          DISABLE_AUTH: "true"
          AUTH_CLERK_V1: "true"
          NEXT_PUBLIC_AUTH_CLERK_V1: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci
          DATABASE_URL: postgres://nova_app:nova_dev_password@localhost:5432/nova_crm
          REDIS_URL: redis://localhost:6379

  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: |
          docker build -t nova-crm-web -f Dockerfile . \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci \
            --build-arg NEXT_PUBLIC_AUTH_CLERK_V1=true \
            --build-arg NEXT_PUBLIC_SITE_URL=https://ci.example.com \
            --build-arg NEXT_PUBLIC_POSTGRES_READ_CRM_V1=true \
            --build-arg NEXT_PUBLIC_POSTGRES_READ_LEADS_V1=true \
            --build-arg NEXT_PUBLIC_POSTGRES_SOLE_WRITER_CRM_V1=true \
            --build-arg NEXT_PUBLIC_POSTGRES_DASHBOARD_SUMMARY_READ_V1=true
      - name: Build worker image
        run: docker build -t nova-crm-worker -f Dockerfile.worker .
      - name: Build migrate image
        run: docker build -t nova-crm-migrate -f Dockerfile.migrate .
      - name: Build cron sidecar image
        run: docker build -t nova-crm-cron -f docker/cron/Dockerfile .

  migrate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_dev_password
          POSTGRES_DB: nova_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build migrate image
        run: docker build -t nova-crm-migrate -f Dockerfile.migrate .

      - name: Fail fast when required env is missing
        run: |
          if docker run --rm --network host nova-crm-migrate 2>/dev/null; then
            echo "expected failure when MIGRATE_DATABASE_URL/NOVA_APP_PASSWORD unset"
            exit 1
          fi

      - name: Run migrate (schema + nova_app password)
        run: |
          docker run --rm --network host \
            -e MIGRATE_DATABASE_URL=postgres://nova:nova_dev_password@localhost:5432/nova_crm \
            -e NOVA_APP_PASSWORD="ci-p@ss'w0rd\$x" \
            nova-crm-migrate

      - name: Verify nova_app authenticates with the new password
        env:
          PGPASSWORD: "ci-p@ss'w0rd$x"
        run: psql -h localhost -U nova_app -d nova_crm -c "select current_user;"

  publish-ghcr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/remove-firebase'
    needs: [checks, docker-images, migrate-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      WEB_CLERK_PK: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ci' }}
      WEB_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ci.example.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.ghcr.outputs.owner }}/nova-crm-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.WEB_CLERK_PK }}
            NEXT_PUBLIC_AUTH_CLERK_V1=true
            NEXT_PUBLIC_SITE_URL=${{ env.WEB_SITE_URL }}
            NEXT_PUBLIC_POSTGRES_READ_CRM_V1=true
            NEXT_PUBLIC_POSTGRES_READ_LEADS_V1=true
            NEXT_PUBLIC_POSTGRES_SOLE_WRITER_CRM_V1=true
            NEXT_PUBLIC_POSTGRES_DASHBOARD_SUMMARY_READ_V1=true

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.ghcr.outputs.owner }}/nova-crm-worker:${{ github.sha }}

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.ghcr.outputs.owner }}/nova-crm-migrate:${{ github.sha }}

      - name: Build and push cron image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cron/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.ghcr.outputs.owner }}/nova-crm-cron:${{ github.sha }}
