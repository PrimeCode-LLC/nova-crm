# CI — production branch: feature/remove-firebase (PostgreSQL/VPS)
# main is Firebase reference only — no production CI/CD from main.
#
# Speed model:
# - PRs: checks + migrate-smoke only (no full image matrix; Next build covers app compile)
# - Push: checks + migrate-smoke + parallel GHCR publish (Buildx GHA cache) + deploy
# - Never build the same Docker image twice in one pipeline
name: CI

on:
  pull_request:
    branches: [feature/remove-firebase]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".cursor/**"
      - "Architecture fixes plan/**"
  push:
    branches: [feature/remove-firebase]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".cursor/**"
      - "Architecture fixes plan/**"

concurrency:
  # Supersede PR runs freely, but never cancel a production-branch run — it can
  # be mid-deploy against the VPS.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # build-push-action@v6 defaults provenance on; GHCR then fails with "unknown blob".
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_dev_password
          POSTGRES_DB: nova_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nova_app:nova_dev_password@localhost:5432/nova_crm
      MIGRATE_DATABASE_URL: postgres://nova:nova_dev_password@localhost:5432/nova_crm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Firebase removal gate (P7.9)
        run: node scripts/check-firebase-imports.mjs

      - name: Validate cron configuration
        run: node scripts/validate-cron-config.mjs

      # Lint and typecheck are independent after npm ci — run in parallel.
      - name: Lint + typecheck
        run: |
          set -euo pipefail
          npm run lint &
          lint_pid=$!
          npm run typecheck &
          tsc_pid=$!
          lint_status=0
          tsc_status=0
          wait "$lint_pid" || lint_status=$?
          wait "$tsc_pid" || tsc_status=$?
          if [ "$lint_status" -ne 0 ] || [ "$tsc_status" -ne 0 ]; then
            echo "lint exit=${lint_status} typecheck exit=${tsc_status}" >&2
            exit 1
          fi

      - name: Migrate Postgres (P2+)
        run: npm run db:migrate:deploy

      - name: Test
        run: npm run test

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{ts,tsx,js,jsx}', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_AUTH_DISABLED: "true"
          DISABLE_AUTH: "true"
          AUTH_CLERK_V1: "true"
          NEXT_PUBLIC_AUTH_CLERK_V1: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci
          DATABASE_URL: postgres://nova_app:nova_dev_password@localhost:5432/nova_crm
          REDIS_URL: redis://localhost:6379
          NEXT_TELEMETRY_DISABLED: "1"

  migrate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_dev_password
          POSTGRES_DB: nova_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build migrate image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: false
          load: true
          tags: nova-crm-migrate:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Fail fast when required env is missing
        run: |
          if docker run --rm --network host nova-crm-migrate:ci 2>/dev/null; then
            echo "expected failure when MIGRATE_DATABASE_URL/NOVA_APP_PASSWORD unset"
            exit 1
          fi

      - name: Run migrate (schema + nova_app password)
        run: |
          docker run --rm --network host \
            -e MIGRATE_DATABASE_URL=postgres://nova:nova_dev_password@localhost:5432/nova_crm \
            -e NOVA_APP_PASSWORD="ci-p@ss'w0rd\$x" \
            nova-crm-migrate:ci

      - name: Verify nova_app authenticates with the new password
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="ci-p@ss'w0rd\$x" \
            postgres:16-alpine \
            psql -h localhost -U nova_app -d nova_crm -c "select current_user;"

  # One build per image, in parallel, with GHA layer cache. Replaces the old
  # docker-images job that rebuilt everything a second time before publish.
  publish-ghcr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/remove-firebase'
    needs: [checks, migrate-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            file: Dockerfile
            cache_scope: web
          - image: worker
            file: Dockerfile.worker
            cache_scope: worker
          - image: migrate
            file: Dockerfile.migrate
            cache_scope: migrate
          - image: cron
            file: docker/cron/Dockerfile
            cache_scope: cron
    env:
      WEB_CLERK_PK: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ci' }}
      WEB_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ci.example.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ steps.ghcr.outputs.owner }}/nova-crm-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          # Unused on non-web images; Docker ignores ARG names that Dockerfile never declares.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.WEB_CLERK_PK }}
            NEXT_PUBLIC_AUTH_CLERK_V1=true
            NEXT_PUBLIC_SITE_URL=${{ env.WEB_SITE_URL }}
            NEXT_PUBLIC_POSTGRES_READ_CRM_V1=true
            NEXT_PUBLIC_POSTGRES_READ_LEADS_V1=true
            NEXT_PUBLIC_POSTGRES_SOLE_WRITER_CRM_V1=true
            NEXT_PUBLIC_POSTGRES_DASHBOARD_SUMMARY_READ_V1=true
            NEXT_PUBLIC_WORKSPACE_CRM_SNAPSHOT_OFF=true

  # Continuous delivery: a green push to feature/remove-firebase deploys the exact
  # SHA whose images publish-ghcr just pushed. `environment: production` is required
  # (not cosmetic) — VPS_* and GHCR_* are environment secrets, not repo secrets.
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/remove-firebase'
    needs: [publish-ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: nova-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_REF: feature/remove-firebase
      DEPLOY_SHA: ${{ github.sha }}
      WEB_HEALTH_URL: https://nova.stellixsoft.com/api/health
    steps:
      - name: Hard guard — production branch only
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/feature/remove-firebase" ]; then
            echo "Refusing deploy: production deploys only from feature/remove-firebase" >&2
            exit 1
          fi
          echo "Deploying ref=${GITHUB_REF} sha=${DEPLOY_SHA}"

      - uses: actions/checkout@v4

      - name: Preparing SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret ${name} in the 'production' environment" >&2
              exit 1
            fi
            echo "  ${name}: set"
          done
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/nova_deploy_key"
          chmod 600 "$RUNNER_TEMP/nova_deploy_key"
          install -d -m 700 "$HOME/.ssh"
          if [ -n "${VPS_SSH_HOST_KEY:-}" ]; then
            printf '%s\n' "$VPS_SSH_HOST_KEY" >> "$HOME/.ssh/known_hosts"
            echo "  host key: pinned from VPS_SSH_HOST_KEY"
          else
            ssh-keyscan -T 20 "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
            echo "  host key: scanned (set VPS_SSH_HOST_KEY to pin it instead)"
          fi

      - name: Deploying SHA to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Values are exported on stdin ahead of the script, so the GHCR token
          # never appears in the VPS process list or in this log.
          {
            printf 'export DEPLOY_REF=%q\n'     "$DEPLOY_REF"
            printf 'export DEPLOY_SHA=%q\n'     "$DEPLOY_SHA"
            printf 'export GHCR_OWNER=%q\n'     "$GHCR_OWNER"
            printf 'export GHCR_USERNAME=%q\n'  "$GHCR_USERNAME"
            printf 'export GHCR_TOKEN=%q\n'     "$GHCR_TOKEN"
            printf 'export WEB_HEALTH_URL=%q\n' "$WEB_HEALTH_URL"
            cat scripts/vps-remote-deploy.sh
          } | ssh \
                -i "$RUNNER_TEMP/nova_deploy_key" \
                -o IdentitiesOnly=yes \
                -o BatchMode=yes \
                -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=10 \
                "$VPS_USER@$VPS_HOST" 'bash -s'

      - name: Checking public health from GitHub
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if body="$(curl -fsS --max-time 15 "$WEB_HEALTH_URL" 2>/dev/null)" \
               && [ "${body#*\"ok\":true}" != "$body" ]; then
              echo "public health OK (attempt ${attempt}): ${body}"
              exit 0
            fi
            sleep 6
          done
          echo "Public health check failed for $WEB_HEALTH_URL" >&2
          exit 1

      - name: Deployment completed successfully
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "### Production deploy succeeded"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| branch | \`${DEPLOY_REF}\` |"
            echo "| deployed sha | \`${DEPLOY_SHA}\` |"
            echo "| images | \`ghcr.io/${owner}/nova-crm-{web,worker,migrate,cron}:${DEPLOY_SHA}\` |"
            echo "| health | ${WEB_HEALTH_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "deployed_sha=${DEPLOY_SHA}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/nova_deploy_key"
