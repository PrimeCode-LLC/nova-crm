# Production stack — Postgres + Redis + web + worker + cron + Caddy
# Local build (dev/emergency only):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Production VPS (immutable GHCR images — see docker-compose.prod.images.yml):
#   DEPLOY_SHA=<git-sha> GHCR_OWNER=<org> ./scripts/deploy-vps.sh

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nova_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL}
      NOVA_APP_PASSWORD: ${NOVA_APP_PASSWORD:?set NOVA_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - tools

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_AUTH_CLERK_V1: ${NEXT_PUBLIC_AUTH_CLERK_V1:-true}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Nova CRM}
        NEXT_PUBLIC_POSTGRES_READ_CRM_V1: ${NEXT_PUBLIC_POSTGRES_READ_CRM_V1:-true}
        NEXT_PUBLIC_POSTGRES_READ_LEADS_V1: ${NEXT_PUBLIC_POSTGRES_READ_LEADS_V1:-true}
        NEXT_PUBLIC_POSTGRES_SOLE_WRITER_CRM_V1: ${NEXT_PUBLIC_POSTGRES_SOLE_WRITER_CRM_V1:-true}
        NEXT_PUBLIC_POSTGRES_DASHBOARD_SUMMARY_READ_V1: ${NEXT_PUBLIC_POSTGRES_DASHBOARD_SUMMARY_READ_V1:-true}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      SITE_URL: ${SITE_URL:?set SITE_URL}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      QUEUE_WORKER_V1: "true"
      QUEUE_IMPORT_CHUNKS_V1: "true"
      QUEUE_HEAVY_JOBS_V1: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - public

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: "8081"
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      QUEUE_WORKER_V1: "true"
      QUEUE_IMPORT_CHUNKS_V1: "true"
      QUEUE_HEAVY_JOBS_V1: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  cron:
    build:
      context: .
      dockerfile: docker/cron/Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    env_file:
      - .env.production
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      WEB_INTERNAL_URL: http://web:3000
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - public

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  public:
